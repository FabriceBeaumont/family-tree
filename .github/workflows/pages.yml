# Publishes public/ (password-encrypted viewer, built with `python src/build_web.py --publish`)
# to GitHub Pages. Repo settings -> Pages -> Source must be "GitHub Actions".
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish unencrypted data
        run: |
          if [ -e public/data.js ] || ! grep -q "FAMILY_DATA_ENC" public/data.enc.js; then
            echo "public/ must contain only the encrypted data.enc.js"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
