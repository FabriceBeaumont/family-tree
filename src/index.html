<script>
  // Browser storage prefix: "stammbaum", or "stammbaum-demo" in the demo build (own settings and edits).
  const STORE = document.documentElement.dataset.store || "stammbaum";
  // Theme: saved choice, else the system setting. Applied before first paint to avoid a flash.
  (() => {
    let saved = null; try { saved = localStorage.getItem(STORE + "-theme"); } catch {}
    const sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : sys;
  })();
</script>

<script>
const LANG_KEY = STORE + "-lang";
let lang = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q in TEXT) return q;
  try { const s = localStorage.getItem(LANG_KEY); if (s in TEXT) return s; } catch {}
  return (navigator.language || "de").toLowerCase().startsWith("en") ? "en" : "de";
})();
const t = key => TEXT[lang][key] ?? TEXT.de[key] ?? key;
const langListeners = [];

// ---------- dates and places from the cleaned data ----------
// Dates are ISO with reduced precision: "1814" -> "im Jahr 1814" / "in the year 1814",
// "1873-08" -> "im August 1873", "1936-10-17" -> "17. Oktober 1936" / "17 October 1936".
const LOCALE = { de: "de-DE", en: "en-GB" };
function fmtDate(iso, qual) {
  if (!iso) return "";
  let out = iso;
  const m = /^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?$/.exec(iso);
  if (m && m[3]) out = new Intl.DateTimeFormat(LOCALE[lang], { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" })
    .format(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])));
  else if (m && m[2]) out = t("inMonth").replace("{m}", new Intl.DateTimeFormat(LOCALE[lang], { month: "long", timeZone: "UTC" })
    .format(new Date(Date.UTC(+m[1], +m[2] - 1, 1)))).replace("{y}", m[1]);
  else if (m) out = t("inYear").replace("{y}", m[1]);
  return out + (qual ? " (?)" : "");
}
const fmtDateOn = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || "") ? t("onDate").replace("{d}", fmtDate(iso)) : fmtDate(iso);
const ADDR_TERMS = { Massengrab: { en: "mass grave" } };         // place details that need a translation
function fmtPlace(place, country, addr, qual) {
  let s = place || "";
  if (addr && /^\d+$/.test(addr)) s = `${s} ${addr}`;            // house number: "Krumau 24"
  if (country) { let c = country; try { c = new Intl.DisplayNames([LOCALE[lang]], { type: "region" }).of(country); } catch {} s = [s, c].filter(Boolean).join(", "); }
  if (addr && !/^\d+$/.test(addr)) s = s ? `${s} (${ADDR_TERMS[addr]?.[lang] || addr})` : ADDR_TERMS[addr]?.[lang] || addr;   // site: "(Massengrab)"
  return s + (s && qual ? " (?)" : "");
}
const eventText = (date, place) => [date, place].filter(Boolean).join(t("in"));   // re-render hooks (e.g. the open detail panel)
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-attr]"))
    for (const pair of el.dataset.i18nAttr.split(";")) { const [attr, key] = pair.split(":"); el.setAttribute(attr, t(key)); }
  const other = lang === "de" ? "en" : "de", bl = document.getElementById("btnLang");
  bl.textContent = other.toUpperCase(); bl.lang = other; bl.title = bl.ariaLabel = TEXT[other].otherLang ? t("otherLang") : other;
  applyThemeButton();
  langListeners.forEach(fn => fn());
}
function setLang(l) {
  if (!(l in TEXT) || l === lang) return;
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch {}
  const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u);
  applyLang();
}
document.getElementById("btnLang").onclick = () => setLang(lang === "de" ? "en" : "de");

// ---------- help dialog ----------
function renderHelp() {
  const icon = id => (document.getElementById(id)?.querySelector("svg")?.outerHTML) || "";
  const row = (dt, key) => `<dt aria-hidden="true">${dt}</dt><dd>${t(key)}</dd>`;
  document.getElementById("helpHeading").textContent = t("helpTitle");
  document.getElementById("helpBody").innerHTML = `
    <h3>${t("helpControls")}</h3><dl>
      ${row("🔍", "helpSearch")}${row(icon("btnFit"), "helpFit")}${row("↑↓", "helpGens")}${row(icon("btnFocus"), "helpFocus")}
      ${row("🩸", "helpBlood")}${row("🌳", "helpTree")}${row("🕰️", "helpTime")}${row("👪", "helpRel")}${row(icon("btnPhotos"), "helpPhotos")}
      ${row(document.getElementById("btnTheme").innerHTML, "helpTheme")}${row(lang === "de" ? "EN" : "DE", "helpLang")}${row("✏️", "helpEdit")}</dl>
    <h3>${t("helpColors")}</h3><dl>
      ${row('<span class="swatch"></span>', "helpDirect")}${row('<span class="swatch spouse"></span>', "helpPartners")}${row('<span class="swatch divorced"></span>', "helpDivorced")}
      ${row('<span class="swatch sib"></span>', "helpSiblings")}${row('<span class="swatch bloodPat"></span><span class="swatch blood"></span><span class="swatch bloodMat"></span>', "helpBlood")}
      ${row('<span class="swatch tree"></span>', "helpTree")}${row('<span class="card"></span><span class="card F"></span>', "helpCards")}</dl>
    <h3>${t("helpMap")}</h3><dl>${row("✋", "helpNav")}${row("›", "helpPanel")}</dl>`;
}
const helpDlg = document.getElementById("help");
document.getElementById("btnHelp").onclick = () => { renderHelp(); helpDlg.showModal(); };
document.getElementById("helpClose").onclick = () => helpDlg.close();
helpDlg.addEventListener("click", ev => { if (ev.target === helpDlg) helpDlg.close(); });   // click on the backdrop
langListeners.push(() => { if (helpDlg.open) renderHelp(); });

// ---------- theme ----------
const ICON_MOON = '<svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path d="M15.2 11.3A6.6 6.6 0 0 1 6.7 2.8a.5.5 0 0 0-.7-.6 7.4 7.4 0 1 0 9.8 9.8.5.5 0 0 0-.6-.7z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.4" fill="currentColor"/><path d="M9 1.5v1.8M9 14.7v1.8M1.5 9h1.8M14.7 9h1.8M3.7 3.7l1.3 1.3M13 13l1.3 1.3M3.7 14.3L5 13M13 5l1.3-1.3"/></svg>';
const themeListeners = [];   // e.g. minimap repaint
const theme = () => document.documentElement.dataset.theme;
function applyThemeButton() {
  const b = document.getElementById("btnTheme"), dark = theme() === "dark";
  b.innerHTML = dark ? ICON_SUN : ICON_MOON;          // show the appearance you would switch to
  b.title = b.ariaLabel = t(dark ? "toLight" : "toDark");
}
function setTheme(th, save = true) {
  document.documentElement.dataset.theme = th;
  if (save) try { localStorage.setItem(STORE + "-theme", th); } catch {}
  applyThemeButton();
  themeListeners.forEach(fn => fn());
}
document.getElementById("btnTheme").onclick = () => setTheme(theme() === "dark" ? "light" : "dark");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {   // follow the system until the user chooses
  let saved = null; try { saved = localStorage.getItem(STORE + "-theme"); } catch {}
  if (!saved) setTheme(e.matches ? "dark" : "light", false);
});
applyLang();

function startViewer(data) {
  const W = 184, H = 64;                                     // person card size

  const people = new Map(data.people.map(p => [p.id, { ...p, parentFam: null, spouseFams: [] }]));
  const fams = new Map(data.families.map(f => [f.id, f]));
  for (const f of data.families) {
    for (const c of f.children) people.get(c).parentFam = f.id;
    for (const s of [f.husband, f.wife]) if (s) people.get(s).spouseFams.push(f.id);
  }

  // surname = birth surname; married = taken surname (SURN.MARR), shown first with "geb. <birth name>" after it
  const shownSurname = p => p.married || p.surname || "";
  const neeLabel = p => p.married && p.surname ? t(p.sex === "M" ? "neeM" : "nee").replace("{name}", p.surname) : "";
  const fullName = p => [p.given, shownSurname(p)].filter(Boolean).join(" ") || t("unknown");
  const lifeSpan = p => (p.by || p.dy) ? `${p.by ? "* " + p.by : ""}${p.by && p.dy ? "  " : ""}${p.dy ? "† " + p.dy : ""}` : "";
  const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  // ---------- layout ----------
  // Partners are merged into one "couple block" (a chain for multiple marriages) so they
  // always sit side by side. dagre then lays out blocks + small family nodes in alternating ranks.
  const GAP = 16;
  const blockOf = new Map();   // person id -> block id
  const blocks = new Map();    // block id -> [person ids in left-to-right order]
  {
    const adj = new Map([...people.keys()].map(id => [id, []]));
    for (const f of fams.values()) if (f.husband && f.wife) { adj.get(f.husband).push(f.wife); adj.get(f.wife).push(f.husband); }
    const seen = new Set();
    for (const id of people.keys()) {
      if (seen.has(id)) continue;
      const comp = []; const stack = [id]; seen.add(id);       // connected spouse component
      while (stack.length) { const x = stack.pop(); comp.push(x); for (const y of adj.get(x)) if (!seen.has(y)) { seen.add(y); stack.push(y); } }
      // order as a path: start at an end (fewest partners), walk greedily
      const start = comp.reduce((a, b) => adj.get(b).length < adj.get(a).length ? b : a);
      const order = [], used = new Set(); let cur = start;
      while (cur) { order.push(cur); used.add(cur); cur = adj.get(cur).find(y => !used.has(y)); }
      for (const x of comp) if (!used.has(x)) order.push(x);
      // man left of woman for simple couples
      if (order.length === 2 && people.get(order[0]).sex === "F" && people.get(order[1]).sex === "M") order.reverse();
      const bid = "B" + blocks.size;
      blocks.set(bid, order);
      for (const x of order) blockOf.set(x, bid);
    }
  }
  // ELK layered layout (better crossing minimisation than dagre for genealogies)
  const MARGIN = 300;
  const LAYOUT_OPTIONS = {
    "elk.algorithm": "layered",
    "elk.direction": "DOWN",
    "elk.spacing.nodeNode": "40",
    "elk.layered.spacing.nodeNodeBetweenLayers": "34",
    "elk.layered.crossingMinimization.strategy": "LAYER_SWEEP",
    "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX",
    "elk.layered.thoroughness": "20",
    "elk.separateConnectedComponents": "true",
    "elk.spacing.componentComponent": "120",
    "elk.edgeRouting": "POLYLINE",
  };
  // keep = null (everyone) or a Set of person + family ids (Fokus mode: "as if alone in the database")
  const visIn = keep => id => !keep || keep.has(id);
  const partnersIn = (f, keep) => [f.husband, f.wife].filter(x => x && visIn(keep)(x));
  function elkGraphFor(keep) {
    const vis = visIn(keep);
    const graph = { id: "root", layoutOptions: LAYOUT_OPTIONS, children: [], edges: [] };
    const blocksUsed = new Map(), famsUsed = [];
    for (const [bid, ids] of blocks) {
      const kept = ids.filter(vis);
      if (!kept.length) continue;
      blocksUsed.set(bid, kept);
      graph.children.push({ id: bid, width: kept.length * W + (kept.length - 1) * GAP, height: H });
    }
    for (const f of fams.values()) {
      const ps = partnersIn(f, keep);
      if (!ps.length || !vis(f.id)) continue;
      famsUsed.push(f);
      graph.children.push({ id: f.id, width: 12, height: 12 });
      const parentBlock = blockOf.get(ps[0]);
      graph.edges.push({ id: "e" + graph.edges.length, sources: [parentBlock], targets: [f.id] });
      const childBlocks = new Set(f.children.filter(vis).map(c => blockOf.get(c)));
      childBlocks.delete(parentBlock);
      for (const cb of childBlocks) graph.edges.push({ id: "e" + graph.edges.length, sources: [f.id], targets: [cb] });
    }
    return { graph, blocksUsed, famsUsed };
  }
  // Siblings left to right = oldest to youngest. ELK orders them freely (and differently for every
  // Fokus subset), so after each layout the child blocks of one family that share a row are re-placed:
  // equal widths simply swap slots; otherwise they are packed into the same span if no other card is there.
  function orderSiblings(P, blocksUsed, famsUsed, keep) {
    const vis = visIn(keep);
    const box = bid => { const ids = blocksUsed.get(bid);
      return { bid, ids, x0: P.get(ids[0]).x - W / 2, w: ids.length * W + (ids.length - 1) * GAP, y: P.get(ids[0]).y }; };
    for (const f of famsUsed) {
      const parentBlock = blockOf.get(partnersIn(f, keep)[0]);
      const year = new Map();                        // child block -> birth year of the child in it
      for (const c of f.children) {
        const b = blockOf.get(c);
        if (vis(c) && blocksUsed.has(b) && b !== parentBlock && !year.has(b)) year.set(b, people.get(c).by ?? Infinity);
      }
      if (year.size < 2) continue;
      const rows = new Map();
      for (const [bid, yr] of year) { const bx = box(bid); bx.yr = yr; (rows.get(bx.y) || rows.set(bx.y, []).get(bx.y)).push(bx); }
      for (const row of rows.values()) {
        if (row.length < 2) continue;
        const cur = row.slice().sort((a, b) => a.x0 - b.x0);
        const want = row.slice().sort((a, b) => (a.yr - b.yr) || (a.x0 - b.x0));   // oldest first, unknown last
        if (want.every((b, i) => b === cur[i])) continue;
        let placed;
        if (want.every(b => b.w === want[0].w)) placed = want.map((b, i) => [b, cur[i].x0]);
        else {                                         // pack left to right, stepping over other families' cards
          const inRow = new Set(row.map(r => r.bid)), y = row[0].y;
          const obstacles = [...blocksUsed.keys()].filter(o => !inRow.has(o)).map(box).filter(o => o.y === y);
          const right = cur[cur.length - 1].x0 + cur[cur.length - 1].w;
          let x = cur[0].x0;
          placed = want.map(b => {
            for (let moved = true; moved;) {
              moved = false;
              for (const o of obstacles) if (o.x0 < x + b.w + 20 && o.x0 + o.w > x - 20) { x = o.x0 + o.w + 40; moved = true; }
            }
            const at = [b, x]; x += b.w + 40; return at;
          });
          if (x - 40 > right + 2 * W) continue;        // would push the siblings far away: keep ELK's order
        }

  async function render() {

    // ---------- kinship: how is a person related to the selected one ("ego")? ----------

      for (const a of edits.add) for (const [col, val] of Object.entries(a.cols)) lines.push(["new", a.id, col, "", clean(val)].join("\t"));
      const d = new Date(), two = n => String(n).padStart(2, "0");    // local time, sorts by date
      const stamp = `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}_${two(d.getHours())}-${two(d.getMinutes())}`;
      const tsv = new TextEncoder().encode(lines.join("\n") + "\n");
      if (!edits.photos.length && !edits.docs.length) return saveBlob(new Blob([tsv], { type: "text/tab-separated-values" }), `${stamp}_edits.tsv`);
      const bytes = src => Uint8Array.from(atob(src.split(",")[1]), ch => ch.charCodeAt(0));   // data: URL -> JPEG bytes
      saveBlob(makeZip([{ name: `${stamp}_edits.tsv`, data: tsv }, ...edits.photos.map(ph => ({ name: ph.file, data: bytes(ph.src) })),
        ...edits.docs.map(d => ({ name: d.file, data: bytes(d.src) }))]), `${stamp}_edits.zip`);
    };
    function saveBlob(blob, name) {
      const url = URL.createObjectURL(blob), link = Object.assign(document.createElement("a"), { href: url, download: name });
      document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    // minimal ZIP writer (stored, no compression – the photos are JPEGs already); names in UTF-8
    function makeZip(files) {
      const table = Array.from({ length: 256 }, (_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xEDB88320 ^ (n >>> 1) : n >>> 1; return n >>> 0; });
      const crc32 = data => { let c = 0xFFFFFFFF; for (const b of data) c = table[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
      const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
      const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
      const put = (view, fields) => fields.forEach(([at, v, n]) => n === 4 ? view.setUint32(at, v, true) : view.setUint16(at, v, true));
      const parts = [], central = [], enc = new TextEncoder();
      let offset = 0;
      for (const f of files) {
        const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
        const head = new DataView(new ArrayBuffer(30)), dir = new DataView(new ArrayBuffer(46));
        put(head, [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [10, time, 2], [12, date, 2], [14, crc, 4], [18, size, 4], [22, size, 4], [26, name.length, 2]]);
        put(dir, [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [12, time, 2], [14, date, 2], [16, crc, 4], [20, size, 4], [24, size, 4], [28, name.length, 2], [42, offset, 4]]);
        parts.push(head, name, f.data); central.push(dir, name);
        offset += 30 + name.length + size;
      }
      const dirSize = central.reduce((a, x) => a + x.byteLength, 0), end = new DataView(new ArrayBuffer(22));
      put(end, [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, dirSize, 4], [16, offset, 4]]);
      return new Blob([...parts, ...central, end], { type: "application/zip" });
    }
    langListeners.push(() => { updateEditButtons(); if (editsBox.open) renderEdits(); });
    updateEditButtons();

    // ---------- photo window ----------
    const pb = document.getElementById("photoBox");
    let pbPerson = null, pbList = [], pbIndex = 0;
    function showPhoto(i) {
      const list = pbList, n = list.length;
      pbIndex = (i + n) % n;
      const ph = list[pbIndex];
      document.getElementById("pbImg").src = ph.src;
      document.getElementById("pbImg").alt = fullName(pbPerson);
      document.getElementById("photoName").textContent = fullName(pbPerson);
      document.getElementById("pbNote").textContent = [ph.title, ph.note].filter(Boolean).join(" – ");
      document.getElementById("pbDate").textContent = ph.title ? "" : ph.date ? fmtDate(ph.date) : t("photoUndated");
      document.getElementById("pbCount").textContent = n > 1 ? `${pbIndex + 1}/${n}` : "";
      document.getElementById("pbPrev").hidden = document.getElementById("pbNext").hidden = n < 2;
    }
    function openPhotos(p, list = p.photos, start = 0) { pbPerson = p; pbList = list; showPhoto(Math.max(0, start)); if (!pb.open) pb.showModal(); }
    document.getElementById("pbPrev").onclick = () => showPhoto(pbIndex - 1);
    document.getElementById("pbNext").onclick = () => showPhoto(pbIndex + 1);
    document.getElementById("pbClose").onclick = () => pb.close();
    pb.addEventListener("click", ev => { if (ev.target === pb) pb.close(); });      // backdrop
    pb.addEventListener("keydown", ev => {
      if (ev.key === "ArrowLeft") { showPhoto(pbIndex - 1); ev.preventDefault(); }
      if (ev.key === "ArrowRight") { showPhoto(pbIndex + 1); ev.preventDefault(); }
    });
    let swipeX = null;                                                             // swipe left / right
    const pbImg = document.getElementById("pbImg");
    pbImg.addEventListener("pointerdown", ev => { swipeX = ev.clientX; });
    pbImg.addEventListener("pointerup", ev => {
      if (swipeX !== null && Math.abs(ev.clientX - swipeX) > 40 && pbList.length > 1) showPhoto(pbIndex + (ev.clientX < swipeX ? 1 : -1));
      swipeX = null;
    });
    langListeners.push(() => { if (pb.open) showPhoto(pbIndex); });

    // ---------- search ----------
    const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
    const index = [...people.values()].map(p => ({ p, key: norm([fullName(p), p.surname, p.callName, p.nick, p.title].filter(Boolean).join(" ")) }));   // taken + birth surname
    let active = 0, hits = [];
    function renderResults() {
      resultsEl.innerHTML = hits.map((p, i) =>
        `<li data-id="${p.id}" class="${i === active ? "active" : ""}">${esc(fullName(p))}${neeLabel(p) ? ` <small>${esc(neeLabel(p))}</small>` : ""}${p.nick ? ` <small>„${esc(p.nick)}“</small>` : ""}<small>${esc(lifeSpan(p))}</small></li>`).join("");
      resultsEl.classList.toggle("open", hits.length > 0);
    }
    searchEl.addEventListener("input", () => {
      const terms = norm(searchEl.value).split(/\s+/).filter(Boolean);
      hits = terms.length ? index.filter(x => terms.every(t => x.key.includes(t))).slice(0, 15).map(x => x.p) : [];
      active = 0; renderResults();
    });
    searchEl.addEventListener("keydown", ev => {
      if (ev.key === "ArrowDown") { active = Math.min(active + 1, hits.length - 1); renderResults(); ev.preventDefault(); }
      if (ev.key === "ArrowUp") { active = Math.max(active - 1, 0); renderResults(); ev.preventDefault(); }
      if (ev.key === "Enter" && hits[active]) pick(hits[active].id);
    });
    resultsEl.addEventListener("mousedown", ev => { const li = ev.target.closest("li"); if (li) pick(li.dataset.id); });
    searchEl.addEventListener("blur", () => setTimeout(() => resultsEl.classList.remove("open"), 150));
    function pick(id) { resultsEl.classList.remove("open"); searchEl.blur(); select(id, true); }

    // ---------- minimap ----------
    const mm = document.getElementById("minimap"), ctx = mm.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    mm.width = mm.clientWidth * dpr; mm.height = mm.clientHeight * dpr;
    let mmScale = 1, mmOff = [0, 0];
    const base = document.createElement("canvas"); base.width = mm.width; base.height = mm.height;
    const bctx = base.getContext("2d");
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    let colors;
    function paintMinimapBase() {           // colours come from the theme tokens
      colors = { M: css("--male"), F: css("--female"), U: css("--unknown"), accent: css("--accent") };
      mmScale = Math.min(mm.width / bounds.w, mm.height / bounds.h);
      mmOff = [(mm.width - bounds.w * mmScale) / 2, (mm.height - bounds.h * mmScale) / 2];
      bctx.clearRect(0, 0, base.width, base.height);
      for (const p of people.values()) {
        if (!vis(p.id) || !P.has(p.id)) continue;
        const n = pos(p.id); bctx.fillStyle = colors[p.sex] || colors.U;
        bctx.fillRect(mmOff[0] + (n.x - W / 2) * mmScale, mmOff[1] + (n.y - H / 2) * mmScale,
          Math.max(1, W * mmScale), Math.max(1, H * mmScale));
      }
    }
    paintMinimapBase();
    themeListeners.push(() => { paintMinimapBase(); drawMinimap(d3.zoomTransform(svg.node())); });
    function drawMinimap(t) {
      if (!mm.width || !mm.height) return;   // minimap hidden (narrow screens)
      ctx.clearRect(0, 0, mm.width, mm.height); ctx.drawImage(base, 0, 0);
      const [w, h] = size();
      const x0 = -t.x / t.k, y0 = -t.y / t.k;
      ctx.strokeStyle = colors.accent; ctx.lineWidth = 2 * dpr;
      ctx.strokeRect(mmOff[0] + x0 * mmScale, mmOff[1] + y0 * mmScale, (w / t.k) * mmScale, (h / t.k) * mmScale);
    }
    function minimapJump(ev) {
      const r = mm.getBoundingClientRect();
      const x = ((ev.clientX - r.left) * dpr - mmOff[0]) / mmScale, y = ((ev.clientY - r.top) * dpr - mmOff[1]) / mmScale;
      const k = d3.zoomTransform(svg.node()).k; flyTo(x, y, k, 0);
    }
    let mmDrag = false;
    mm.addEventListener("pointerdown", ev => { mmDrag = true; mm.setPointerCapture(ev.pointerId); minimapJump(ev); });
    mm.addEventListener("pointermove", ev => { if (mmDrag) minimapJump(ev); });
    mm.addEventListener("pointerup", () => { mmDrag = false; });

    // ---------- start: whole tree, nobody preferred ----------
    document.getElementById("btnFit").onclick = () => {           // the only way to deselect
      clearSelection();
      if (!(focusOn && lastFocusSet.size)) { fitAll(); untouched = true; }   // Fokus without a selection frames the highlighted group itself
    };
    applyHighlight();                       // initial state of the header toggles and the legend
    fitAll(0);                              // start like ⤢: the whole tree visible
    // until the first pan / zoom / selection, keep it that way when the window size changes
    // (window restored or rotated, password screen gone, browser bars appearing)
    let fitTimer = 0;
    addEventListener("resize", () => {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => { if (untouched && !selected) fitAll(0); }, 150);
    });
    document.getElementById("loading").remove();
  }

  // let the "loading" text paint before the (blocking) layout runs
  requestAnimationFrame(() => setTimeout(() => render().catch(err => {
    document.getElementById("loading").textContent = t("layoutError") + err.message; console.error(err);
  }), 30));
}

// ---------- data loading: plain (web/data.js) or password-encrypted (public/data.enc.js) ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(enc, password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function showLock(enc) {
  const lock = document.getElementById("lock"), form = document.getElementById("lockForm");
  const input = document.getElementById("lockPw"), msg = document.getElementById("lockMsg");
  const SKEY = STORE + "-pw";
  async function tryOpen(pw, fromSession) {
    msg.textContent = t("decrypting");
    try {
      const data = await decrypt(enc, pw);
      try { sessionStorage.setItem(SKEY, pw); } catch {}
      lock.remove();
      startViewer(data);
    } catch {
      try { sessionStorage.removeItem(SKEY); } catch {}
      msg.textContent = fromSession ? "" : t("wrongPassword");
      input.select();
    }
  }
  lock.hidden = false;
  document.getElementById("loading").hidden = true;
  form.addEventListener("submit", ev => {
    ev.preventDefault();
    document.getElementById("loading").hidden = false;
    tryOpen(input.value, false);
  });
  input.focus();
  let saved = null; try { saved = sessionStorage.getItem(SKEY); } catch {}
  if (saved) tryOpen(saved, true);
}
if (window.FAMILY_DATA) startViewer(window.FAMILY_DATA);
else if (window.FAMILY_DATA_ENC) showLock(window.FAMILY_DATA_ENC);
else document.getElementById("loading").textContent = t("noData");
if (document.documentElement.hasAttribute("data-demo")) document.getElementById("demoBadge").hidden = false;
</script>
